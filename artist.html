<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="utf-8">
<title>Requisite Vinyl Album Collection</title>

<script>
(function(){
  function detectTouchDevice(){
    var coarsePointer =
      window.matchMedia && window.matchMedia("(hover: none) and (pointer: coarse)").matches;
    var touchPoints = navigator.maxTouchPoints > 0;
    var ipadLikeMac = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
    return coarsePointer || touchPoints || ipadLikeMac;
  }

  if(detectTouchDevice()){
    document.addEventListener("DOMContentLoaded", function(){
      document.body.classList.add("touch-mode");
    });
  }
})();
</script>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;
  color:#ddd5ca;
}

body.dark-default{ background-image:url("backgrounds/rac.jpg"); }
body.dark-muted{ background-image:url("backgrounds/rac.jpg"); }
body.dark-ultra{ background-image:url("backgrounds/rac.jpg"); }

body{
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.58);
  z-index:-1;
}

body::after{
  content:none;
}

.app-header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:84px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 28px;
  z-index:100;
  box-sizing:border-box;
}

.header-left{
  display:flex;
  align-items:center;
  gap:14px;
  padding:10px 14px;
  background:rgba(18,18,18,.42);
  border-radius:12px;
  box-shadow:
    0 10px 24px rgba(0,0,0,.35),
    0 2px 4px rgba(0,0,0,.25);
  backdrop-filter:blur(4px);
}

.header-left label{
  font-size:20px;
  font-weight:800;
  color:#e0d8cc;
  letter-spacing:.02em;
}

.header-left select{
  min-width:280px;
  padding:10px 14px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(28,28,28,.88);
  color:#f0f0f0;
  font-size:15px;
  outline:none;
}

.header-brand{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:8px;
  padding-top:11px;
}

.header-links{
  display:flex;
  align-items:center;
  gap:16px;
}

.back-link{
  color:#cfe3ff;
  text-decoration:none;
  border-bottom:1px solid rgba(207,227,255,.35);
  font-size:14px;
  font-weight:700;
  letter-spacing:.02em;
}

.back-link:hover{
  border-bottom-color:rgba(207,227,255,.8);
}

.app-header img{
  height:68px;
  object-fit:contain;
  border-radius:10px;
  opacity:.96;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.55)) saturate(.98) brightness(.99);
}

.container{
  padding:118px 28px 60px;
  max-width:1420px;
  margin:0 auto;
  box-sizing:border-box;
}

.artist-panels{
  display:grid;
  grid-template-columns:260px minmax(260px, 1fr) minmax(260px, 1fr);
  gap:20px;
  margin-bottom:18px;
  align-items:stretch;
}

.panel{
  background:rgba(20,20,20,.52);
  border-radius:14px;
  padding:18px;
  box-shadow:
    0 12px 28px rgba(0,0,0,.42),
    0 3px 6px rgba(0,0,0,.28);
  backdrop-filter:blur(4px);
}

.artist-image-panel{
  padding:12px;
}

.artist-image,
.artist-image-placeholder{
  width:100%;
  aspect-ratio:1 / 1;
  border-radius:10px;
}

.artist-image{
  display:block;
  object-fit:cover;
  background:rgba(255,255,255,.04);
}

.artist-image-placeholder{
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:rgba(255,255,255,.05);
  color:#c7c1b8;
  font-size:14px;
}

.panel-title{
  font-size:16px;
  font-weight:700;
  margin-bottom:14px;
  color:#e2dacd;
}

.meta-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px 16px;
}

.meta-item{
  font-size:13px;
}

.meta-label{
  display:block;
  font-size:11px;
  text-transform:uppercase;
  color:#a9a297;
  margin-bottom:3px;
}

.meta-value{
  display:block;
  font-size:13px;
  color:#cbc5bb;
}

.meta-value a{
  color:#cfe3ff;
  text-decoration:none;
  border-bottom:1px solid rgba(207,227,255,.35);
}

.meta-value a:hover{
  border-bottom-color:rgba(207,227,255,.8);
}

.panel-text{
  font-size:14px;
  line-height:1.5;
  white-space:pre-wrap;
  max-height:165px;
  overflow-y:auto;
  padding-right:6px;
  color:#cbc6bd;
}

.news-panel{

}

.section-title{
  font-size:28px;
  font-weight:800;
  margin:0 0 18px;
  color:#e2dacd;
}

.albums{
  display:flex;
  gap:24px;
  flex-wrap:wrap;
}

.card{
  position:relative;
  width:200px;
  background:rgba(20,20,20,.58);
  border-radius:12px;
  padding:12px;
  box-shadow:
    0 12px 28px rgba(0,0,0,.7),
    0 3px 6px rgba(0,0,0,.6);
  backdrop-filter:blur(4px);
  overflow:hidden;
  cursor:pointer;
}

.card img{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:8px;
  display:block;
  background:rgba(255,255,255,.05);
}

.year-line{
  margin-top:10px;
  font-size:12px;
  color:#c6c0b6;
  letter-spacing:.04em;
}

.album-title{
  margin-top:4px;
  font-size:15px;

  line-height:1.35;

}

.collection-line{

  font-size:12px;

  justify-content:space-between;

}

.priority-mark{

  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.collection-mark{
  font-weight:700;
  letter-spacing:.02em;
  color:#8fdc8f;
  flex-shrink:0;
  white-space:nowrap;
}

.hover-detail{
  position:absolute;
  left:12px;
  right:12px;
  top:12px;
  bottom:12px;
  padding:14px;
  border-radius:8px;
  background:rgba(0,0,0,.88);
  opacity:0;
  transition:opacity .2s;
  overflow:auto;
  pointer-events:none;
}

.card.preview-open .hover-detail{
  opacity:1;
  pointer-events:auto;
}

.hover-detail.is-empty{
  display:none;
}

.card:focus-visible .hover-detail{
  opacity:1;
  pointer-events:auto;
}

.card:focus-visible{
  outline:2px solid rgba(255,255,255,.75);
  outline-offset:2px;
}

.hover-track-line{
  font-size:12px;
  line-height:1.35;
  color:#dbd3c7;
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:10px;
  align-items:start;
}

.hover-track-line + .hover-track-line{

}

.hover-track-position{
  color:#c2bcb2;
  white-space:nowrap;
}

.hover-track-title{
  min-width:0;
}

.hover-track-duration{
  color:#c2bcb2;
  white-space:nowrap;
}

.hover-actions{
  margin-top:14px;
  padding-top:12px;
  border-top:1px solid rgba(255,255,255,.12);
}

.hover-album-link{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:36px;
  padding:0 12px;
  border-radius:8px;

  color:#f3f7ff;
  text-decoration:none;
  border:1px solid rgba(207,227,255,.22);
  font-size:12px;
  font-weight:700;
  letter-spacing:.03em;
}

.hover-album-link:hover,
.hover-album-link:focus-visible{
  background:rgba(207,227,255,.22);
  border-color:rgba(207,227,255,.38);
}

.hover-album-link:focus-visible{
  outline:1px solid rgba(255,255,255,.45);
  outline-offset:1px;
}

.reference-block{
  margin-top:38px;
}

.reference-list{
  display:grid;
  gap:10px;
}

.reference-item{
  font-size:18px;
  padding:12px 14px;
  background:rgba(20,20,20,.42);
  border-radius:10px;
  box-shadow:

}

.reference-empty{

.app-footer{

  font-size:12px;
  line-height:1.6;

.app-footer a{

.app-footer a:hover{

@media (hover: hover) and (pointer: fine){

body.touch-mode{
  background-attachment:scroll !important;
  background-image:none !important;
  background-color:#000 !important;
}

body.touch-mode.dark-default,
body.touch-mode.dark-muted,
body.touch-mode.dark-ultra{
  background-attachment:scroll !important;
}

body.touch-mode::before{
  content:"" !important;
  display:block !important;
  position:fixed !important;
  inset:0 !important;
  z-index:-2 !important;
  background-image:url("backgrounds/rac.jpg") !important;
  background-size:cover !important;
  background-position:center !important;
  background-repeat:no-repeat !important;
  pointer-events:none !important;
  background-color:transparent !important;
  -webkit-backdrop-filter:none !important;
  backdrop-filter:none !important;
  filter:none !important;
}

body.touch-mode::after{
  content:"" !important;
  display:block !important;
  position:fixed !important;
  inset:0 !important;
  z-index:-1 !important;
  background:rgba(0,0,0,.45) !important;
  pointer-events:none !important;
  -webkit-backdrop-filter:none !important;
  backdrop-filter:none !important;
  filter:none !important;
}

body.touch-mode .app-header,
body.touch-mode .header-left,
body.touch-mode .header-brand,
body.touch-mode .panel,
body.touch-mode .card,

body.touch-mode .reference-item,

  backdrop-filter:none !important;
  filter:none !important;
}

body.touch-mode .header-left{
  background:rgba(18,18,18,.18) !important;
  box-shadow:
    0 8px 18px rgba(0,0,0,.14),

}

body.touch-mode .card{

}

body.touch-mode .hover-detail{

}

body.touch-mode .reference-item,
body.touch-mode .app-footer{
  background:rgba(20,20,20,.10) !important;
  box-shadow:
    0 8px 18px rgba(0,0,0,.12),
    0 2px 4px rgba(0,0,0,.07) !important;
}
</style>
</head>

<body class="dark-default">

<div class="app-header">
  <div class="header-left">
    <label for="artistSelect">Artist</label>
    <select id="artistSelect"></select>
  </div>
  <div class="header-brand">
    <img src="backgrounds/banner.png?v=20260409" alt="Requisite Vinyl Album Collection">
    <div class="header-links">
      <a class="back-link" href="index.html">Back to Artists</a>
      <a id="browseAlbumsLink" class="back-link" href="albums/index.html">Browse Albums</a>
    </div>
  </div>
</div>

<div class="container">
  <div id="library"></div>
</div>

<script>
function fetchAlbumTrackExport(){
  return fetch("./data/albums/albums_export.json?v=" + Date.now())
    .then(function(r){
      if(!r.ok) return [];
      return r.json();
    })
    .catch(function(){
      return [];
    });
}

Promise.all([
  fetch("./library.json?v=" + Date.now()).then(function(r){ return r.json(); }),
  fetchAlbumTrackExport()
])
  .then(function(results){
    var data = results[0] || [];
    var albumExport = results[1] || [];

    function present(value){
      return value !== null && value !== undefined && String(value).trim() !== "";
    }

    function safe(value){
      return present(value) ? String(value) : "—";
    }

    function coverSrc(path){
      if(!present(path)) return "";
      return "media/covers/" + String(path).split("/").pop();
    }

    function artistImageSrc(path){
      if(!present(path)) return "";
      return "media/artists/" + String(path).split("/").pop();
    }

    function isOwned(value){
      return (
        value === 1 ||
        value === "1" ||
        value === true ||
        String(value).toLowerCase() === "true"
      );
    }

    function cleanProfile(text){
      if(!present(text)) return "";
      return String(text).replace(/\r\n/g, "\n").trim();
    }

    var albumTrackLookup = {};
    albumExport.forEach(function(item){
      if(!item || !item.album) return;
      var key = String(item.album.album_id || "").trim();
      if(!present(key)) return;
      albumTrackLookup[key] = Array.isArray(item.tracks) ? item.tracks : [];
    });

    function trackPreviewLines(album){
      if(!album || !present(album.album_id)) return [];

      var tracks = albumTrackLookup[String(album.album_id).trim()] || [];

      return tracks
        .map(function(track){
          if(!track || !present(track.track_title || track.title)) return null;

          var position = "";
          if(present(track.position_raw)){
            position = String(track.position_raw).trim();
          } else if(present(track.side) && present(track.track_number)){
            position = String(track.side).trim() + String(track.track_number).trim();
          } else if(present(track.track_number)){
            position = String(track.track_number).trim();
          }

          return {
            position: position,
            title: String(track.track_title || track.title).trim(),
            duration: present(track.duration) ? String(track.duration).trim() : ""
          };
        })
        .filter(Boolean);
    }

    var artists = {};

    data.forEach(function(row){
      var key = String(row.artist_id || row.artist_name || "unknown");

      if(!artists[key]){
        artists[key] = {
          artist_id: row.artist_id,
          artist_name: row.artist_name || "Unknown Artist",
          info: {},
          curated: [],
          reference: []
        };
      }

      var info = artists[key].info;

      if(present(row.artist_name) && !present(info.artist_name)) info.artist_name = row.artist_name;
      if(present(row.sort_name) && !present(info.sort_name)) info.sort_name = row.sort_name;
      if(present(row.genre) && !present(info.genre)) info.genre = row.genre;
      if(present(row.artist_type) && !present(info.artist_type)) info.artist_type = row.artist_type;
      if(present(row.area) && !present(info.area)) info.area = row.area;
      if(present(row.born) && !present(info.born)) info.born = row.born;
      if(present(row.ended) && !present(info.ended)) info.ended = row.ended;
      if(present(row.description) && !present(info.description)) info.description = row.description;
      if(present(row.image_path) && !present(info.image_path)) info.image_path = row.image_path;
      if(present(row.discogs_artist_id)) info.discogs_artist_id = row.discogs_artist_id;

      var hasCuratedAlbumId =
        row.album_id !== null &&
        row.album_id !== undefined &&
        String(row.album_id).trim() !== "";

      var hasReferenceTitle =
        row.ref_title !== null &&
        row.ref_title !== undefined &&
        String(row.ref_title).trim() !== "";

      if(hasCuratedAlbumId){
        artists[key].curated.push(row);
      } else if(hasReferenceTitle){
        artists[key].reference.push(row);
      }
    });

    var artistList = Object.keys(artists)
      .map(function(key){ return artists[key]; })
      .sort(function(a, b){
        return a.artist_name.localeCompare(b.artist_name);
      });

    var select = document.getElementById("artistSelect");
    var container = document.getElementById("library");
    var browseAlbumsLink = document.getElementById("browseAlbumsLink");
    var params = new URLSearchParams(window.location.search);
    var requestedArtistId = String(params.get("artist_id") || "").trim();
    var activePreviewCard = null;

    function isTouchPreviewMode(){
      return document.body.classList.contains("touch-mode");
    }

    function closeActivePreview(){
      if(!activePreviewCard) return;
      activePreviewCard.classList.remove("preview-open");
      activePreviewCard = null;
    }

    function openPreview(card){
      if(activePreviewCard && activePreviewCard !== card){
        closeActivePreview();
      }
      activePreviewCard = card;
      card.classList.add("preview-open");
    }

    select.innerHTML = "";

    artistList.forEach(function(artist){
      var option = document.createElement("option");
      option.value = String(artist.artist_id);
      option.textContent = artist.artist_name;
      select.appendChild(option);
    });

    function render(artistId){
      closeActivePreview();
      var artist = artistList.find(function(item){
        return String(item.artist_id) === String(artistId);
      });

      if(!artist) return;

      if(browseAlbumsLink){
        browseAlbumsLink.href = "albums/index.html?artist_id=" + encodeURIComponent(artist.artist_id);
      }

      container.innerHTML = "";

      var panels = document.createElement("div");
      panels.className = "artist-panels";

      var imagePanel = document.createElement("div");
      imagePanel.className = "panel artist-image-panel";

      var imagePath = artistImageSrc(artist.info.image_path);

      if(present(imagePath)){
        var artistImg = document.createElement("img");
        artistImg.className = "artist-image";
        artistImg.src = imagePath;
        artistImg.alt = safe(artist.artist_name);
        artistImg.onerror = function(){
          imagePanel.innerHTML = "<div class='artist-image-placeholder'>No artist image</div>";
        };
        imagePanel.appendChild(artistImg);
      } else {
        imagePanel.innerHTML = "<div class='artist-image-placeholder'>No artist image</div>";
      }

      var meta = document.createElement("div");
      meta.className = "panel";
      meta.innerHTML = "<div class='panel-title'>Metadata</div>";

      var grid = document.createElement("div");
      grid.className = "meta-grid";

      [
        ["Sort", artist.info.sort_name],
        ["Genre", artist.info.genre],
        ["Type", artist.info.artist_type],
        ["Area", artist.info.area],
        ["Born", artist.info.born],
        ["Disbanded/Died", artist.info.ended],
        ["Source", artist.info.discogs_artist_id]
      ].forEach(function(pair){
        var item = document.createElement("div");
        item.className = "meta-item";

        var label = document.createElement("span");
        label.className = "meta-label";
        label.textContent = pair[0];

        var value = document.createElement("span");
        value.className = "meta-value";

        if(pair[0] === "Source" && present(pair[1])){
          var a = document.createElement("a");
          a.href = "https://www.discogs.com/artist/" + pair[1];
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = "Discogs";

          var span = document.createElement("span");
          span.textContent = " (data)";

          value.appendChild(a);
          value.appendChild(span);
        } else {
          value.textContent = safe(pair[1]);
        }

        item.appendChild(label);
        item.appendChild(value);
        grid.appendChild(item);
      });

      meta.appendChild(grid);

      var profile = document.createElement("div");
      profile.className = "panel";
      profile.innerHTML =
        "<div class='panel-title'>Profile</div>" +
        "<div class='panel-text'>" + safe(cleanProfile(artist.info.description)) + "</div>";

      var news = document.createElement("div");
      news.className = "panel news-panel";
      news.innerHTML =
        "<div class='panel-title'>News</div>" +
        "<div class='panel-text'>Placeholder</div>";

      panels.appendChild(imagePanel);
      panels.appendChild(meta);
      panels.appendChild(profile);

      container.appendChild(panels);
      container.appendChild(news);

      var curatedTitle = document.createElement("div");
      curatedTitle.className = "section-title";
      curatedTitle.textContent = "Recommended Albums";
      container.appendChild(curatedTitle);

      var albums = document.createElement("div");
      albums.className = "albums";

      artist.curated
        .sort(function(a, b){
          var ay = present(a.year) ? Number(a.year) : 9999;
          var by = present(b.year) ? Number(b.year) : 9999;
          if(ay !== by) return ay - by;
          return String(a.album_title || "").localeCompare(String(b.album_title || ""));
        })
        .forEach(function(album){
          var card = document.createElement("div");
          card.className = "card";
          card.tabIndex = 0;
          card.setAttribute("role", "link");

          var albumHref = "albums/album.html?id=" + encodeURIComponent(album.album_id);

          var img = document.createElement("img");
          img.src = coverSrc(album.cover_path);
          img.alt = safe(album.album_title);

          var year = document.createElement("div");
          year.className = "year-line";
          year.textContent = safe(album.year);

          var albumTitle = document.createElement("div");
          albumTitle.className = "album-title";
          albumTitle.textContent = safe(album.album_title);

          var collectionLine = document.createElement("div");
          collectionLine.className = "collection-line";

          var priority = document.createElement("span");
          priority.className = "priority-mark";
          priority.textContent = safe(album.buy_priority);

          var owned = document.createElement("span");
          owned.className = "collection-mark";
          owned.textContent = isOwned(album.owned) ? "✓ Owned" : "";

          var hover = document.createElement("div");
          hover.className = "hover-detail";
          var previewLines = trackPreviewLines(album);

          if(previewLines.length){
            previewLines.forEach(function(track){
              var line = document.createElement("div");
              line.className = "hover-track-line";

              var position = document.createElement("span");
              position.className = "hover-track-position";
              position.textContent = track.position;

              var title = document.createElement("span");
              title.className = "hover-track-title";
              title.textContent = track.title;

              line.appendChild(position);
              line.appendChild(title);

              if(present(track.duration)){
                var duration = document.createElement("span");
                duration.className = "hover-track-duration";
                duration.textContent = track.duration;
                line.appendChild(duration);
              }

              hover.appendChild(line);
            });
          } else {
            var fallback = document.createElement("div");
            fallback.className = "hover-track-line";

            var fallbackTitle = document.createElement("span");
            fallbackTitle.className = "hover-track-title";
            fallbackTitle.textContent = "Track detail not yet available";
            fallbackTitle.style.gridColumn = "1 / -1";

            fallback.appendChild(fallbackTitle);
            hover.appendChild(fallback);
          }

          var hoverActions = document.createElement("div");
          hoverActions.className = "hover-actions";

          var albumLink = document.createElement("a");
          albumLink.className = "hover-album-link";
          albumLink.href = albumHref;
          albumLink.textContent = "Open album page";
          albumLink.addEventListener("click", function(event){
            event.preventDefault();
            event.stopPropagation();
            window.location.href = albumHref;
          });
          hoverActions.appendChild(albumLink);
          hover.appendChild(hoverActions);

          card.addEventListener("click", function(event){
            if(isTouchPreviewMode()){
              event.preventDefault();
              event.stopPropagation();
              if(activePreviewCard === card){
                return;
              }
              openPreview(card);
              return;
            }
            window.location.href = albumHref;
          });
          card.addEventListener("keydown", function(event){
            if(event.key === "Enter" || event.key === " "){
              event.preventDefault();
              window.location.href = albumHref;
            }
          });

          collectionLine.appendChild(priority);
          collectionLine.appendChild(owned);

          card.appendChild(img);
          card.appendChild(year);
          card.appendChild(albumTitle);
          card.appendChild(collectionLine);
          card.appendChild(hover);

          albums.appendChild(card);
        });

      container.appendChild(albums);

      var referenceBlock = document.createElement("div");
      referenceBlock.className = "reference-block";

      var referenceTitle = document.createElement("div");
      referenceTitle.className = "section-title";
      referenceTitle.textContent = "Other Studio Albums";
      referenceBlock.appendChild(referenceTitle);

      if(artist.reference.length){
        var referenceList = document.createElement("div");
        referenceList.className = "reference-list";

        artist.reference
          .sort(function(a, b){
            var ay = present(a.year) ? Number(a.year) : 9999;
            var by = present(b.year) ? Number(b.year) : 9999;
            if(ay !== by) return ay - by;
            return String(a.ref_title || "").localeCompare(String(b.ref_title || ""));
          })
          .forEach(function(refAlbum){
            var item = document.createElement("div");
            item.className = "reference-item";
            item.textContent = safe(refAlbum.ref_title);
            referenceList.appendChild(item);
          });

        referenceBlock.appendChild(referenceList);
      } else {
        var empty = document.createElement("div");
        empty.className = "reference-empty";
        empty.textContent = "Reference album data not yet present in current JSON.";
        referenceBlock.appendChild(empty);
      }

      container.appendChild(referenceBlock);

      var footer = document.createElement("div");
      footer.className = "app-footer";
      footer.innerHTML =
        'Data sources: ' +
        '<a href="https://www.discogs.com" target="_blank" rel="noopener noreferrer">Discogs</a>, ' +
        '<a href="https://musicbrainz.org" target="_blank" rel="noopener noreferrer">MusicBrainz</a>, ' +
        '<a href="https://www.wikipedia.org" target="_blank" rel="noopener noreferrer">Wikipedia</a>. ' +
        'Metadata, images and reference information remain the property of their respective sources.';
      container.appendChild(footer);
    }

    select.onchange = function(){
      render(select.value);
    };

    document.addEventListener("pointerdown", function(event){
      if(!isTouchPreviewMode() || !activePreviewCard) return;
      if(activePreviewCard.contains(event.target)) return;
      closeActivePreview();
    });

    window.addEventListener("resize", function(){
      if(!isTouchPreviewMode()){
        closeActivePreview();
      }
    });

    window.addEventListener("scroll", function(){
      if(isTouchPreviewMode()){
        closeActivePreview();
      }
    }, { passive: true });

    if(artistList.length){
      var initialArtist = artistList.find(function(item){
        return String(item.artist_id).trim() === requestedArtistId;
      });
      if(initialArtist){
        select.value = String(initialArtist.artist_id);
        render(initialArtist.artist_id);
        var cleanUrl = window.location.pathname + window.location.hash;
        window.history.replaceState({}, "", cleanUrl);
      } else {
        select.value = String(artistList[0].artist_id);
        render(artistList[0].artist_id);
      }
    } else {
      container.innerHTML =
        "<div class='panel'><div class='panel-title'>Error</div><div class='panel-text'>No artist data found.</div></div>";
    }
  })
  .catch(function(err){
    console.error(err);
    document.getElementById("library").innerHTML =
      "<div class='panel'><div class='panel-title'>Error</div><div class='panel-text'>Failed to load library.json</div></div>";
  });
</script>

</body>
</html>
