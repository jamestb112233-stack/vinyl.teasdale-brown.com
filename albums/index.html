<script>
(function(){
  function detectTouchDevice(){
    var coarsePointer =
      window.matchMedia && window.matchMedia("(hover: none) and (pointer: coarse)").matches;
    var touchPoints = navigator.maxTouchPoints > 0;
    var ipadLikeMac = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
    return coarsePointer || touchPoints || ipadLikeMac;
  }

  if(detectTouchDevice()){
    document.addEventListener("DOMContentLoaded", function(){
      document.body.classList.add("touch-mode");
    });
  }
})();

<script>
function syncScrollState(){
  document.body.classList.toggle("scrolled", window.scrollY > 48);
}

var lastScrollY = 0;

function syncBrowserChrome(){
  var currentScrollY = window.scrollY;
  var nearTop = currentScrollY <= 24;
  var browsingDepth = currentScrollY > 120;
  var scrollingDown = currentScrollY > lastScrollY;

  syncScrollState();

  if(nearTop){
    document.body.classList.remove("filter-hidden");
  } else if(browsingDepth && scrollingDown){
    document.body.classList.add("filter-hidden");
  } else if(!scrollingDown){
    document.body.classList.remove("filter-hidden");
  }

  lastScrollY = currentScrollY;
}

window.addEventListener("scroll", syncBrowserChrome, { passive: true });
window.addEventListener("load", syncScrollState);
window.addEventListener("load", syncBrowserChrome);

function fetchAlbumExport(){
  return fetch("../data/albums/albums_export.json?v=" + Date.now()).then(function(r){
    if(!r.ok) throw new Error("Failed to load ../data/albums/albums_export.json");
    return r.json();
  });
}

fetchAlbumExport()
  .then(function(data){
    var items = Array.isArray(data) ? data : [];
    var albums = items
      .map(function(item){ return item && item.album ? item.album : null; })
      .filter(Boolean);

    var params = new URLSearchParams(window.location.search);

    var filters = {
      artist: document.getElementById("artistFilter"),
      priority: document.getElementById("priorityFilter"),
      owned: document.getElementById("ownedFilter"),
      genre: document.getElementById("genreFilter"),
      era: document.getElementById("eraFilter"),
      reset: document.getElementById("resetFilters")
    };

    var albumGrid = document.getElementById("albumGrid");
    var resultCount = document.getElementById("resultCount");
    var backToArtistsLink = document.getElementById("backToArtistsLink");
    var activePreviewCard = null;

    function isTouchPreviewMode(){
      return document.body.classList.contains("touch-mode");
    }

    function closeActivePreview(){
      if(!activePreviewCard) return;
      activePreviewCard.classList.remove("preview-open");
      activePreviewCard = null;
    }

    function openPreview(card){
      if(activePreviewCard && activePreviewCard !== card){
        closeActivePreview();
      }
      activePreviewCard = card;
      card.classList.add("preview-open");
    }

    function present(value){
      return value !== null && value !== undefined && String(value).trim() !== "";
    }

    function safe(value){
      return present(value) ? String(value) : "—";
    }

    function isOwned(value){
      return (
        value === 1 ||
        value === "1" ||
        value === true ||
        String(value).toLowerCase() === "true"
      );
    }

    function coverSrc(path){
      if(!present(path)) return "";
      return "../media/covers/" + String(path).split("/").pop();
    }

    function trackPreviewLines(item){
      var tracks = Array.isArray(item && item.tracks) ? item.tracks : [];

      return tracks
        .map(function(track){
          if(!track || !present(track.track_title || track.title)) return null;

          var position = "";
          if(present(track.position_raw)){
            position = String(track.position_raw).trim();
          } else if(present(track.side) && present(track.track_number)){
            position = String(track.side).trim() + String(track.track_number).trim();
          } else if(present(track.track_number)){
            position = String(track.track_number).trim();
          }

          return {
            position: position,
            title: String(track.track_title || track.title).trim(),
            duration: present(track.duration) ? String(track.duration).trim() : ""
          };
        })
        .filter(Boolean);
    }

    function compareText(a, b){
      return String(a || "").localeCompare(String(b || ""));
    }

    function compareAlbums(a, b){
      var ay = present(a.year) ? Number(a.year) : 9999;
      var by = present(b.year) ? Number(b.year) : 9999;
      if(ay !== by) return ay - by;

      var artistCompare = compareText(a.artist_name, b.artist_name);
      if(artistCompare !== 0) return artistCompare;

      return compareText(a.album_title, b.album_title);
    }

    function buildUniqueOptions(key){
      return albums
        .map(function(album){ return present(album[key]) ? String(album[key]).trim() : ""; })
        .filter(function(value, index, list){
          return value && list.indexOf(value) === index;
        })
        .sort(function(a, b){ return a.localeCompare(b); });
    }

    function setOptions(select, items, valueKey, labelKey){
      select.innerHTML = "";

      var defaultOption = document.createElement("option");
      defaultOption.value = "";
      defaultOption.textContent = "All";
      select.appendChild(defaultOption);

      items.forEach(function(item){
        var option = document.createElement("option");
        if(typeof item === "object"){
          option.value = String(item[valueKey]);
          option.textContent = String(item[labelKey]);
        } else {
          option.value = String(item);
          option.textContent = String(item);
        }
        select.appendChild(option);
      });
    }

    var artistOptions = albums
      .reduce(function(list, album){
        if(!present(album.artist_id) || !present(album.artist_name)) return list;

        var key = String(album.artist_id).trim();
        if(list.some(function(item){ return item.artist_id === key; })) return list;

        list.push({
          artist_id: key,
          artist_name: String(album.artist_name).trim()
        });
        return list;
      }, [])
      .sort(function(a, b){
        return a.artist_name.localeCompare(b.artist_name);
      });

    setOptions(filters.artist, artistOptions, "artist_id", "artist_name");
    setOptions(filters.genre, buildUniqueOptions("album_genre"));
    setOptions(filters.era, buildUniqueOptions("era"));

    var initialArtistId = String(params.get("artist_id") || "").trim();
    var initialPriority = String(params.get("buy_priority") || "").trim();
    var initialOwned = String(params.get("owned") || "").trim().toLowerCase();
    var initialGenre = String(params.get("genre") || "").trim();
    var initialEra = String(params.get("era") || "").trim();

    if(initialArtistId) filters.artist.value = initialArtistId;
    if(initialPriority) filters.priority.value = initialPriority;
    if(initialOwned) filters.owned.value = initialOwned;
    if(initialGenre) filters.genre.value = initialGenre;
    if(initialEra) filters.era.value = initialEra;

    function updateUrl(){
      var next = new URLSearchParams();

      if(filters.artist.value) next.set("artist_id", filters.artist.value);
      if(filters.priority.value) next.set("buy_priority", filters.priority.value);
      if(filters.owned.value) next.set("owned", filters.owned.value);
      if(filters.genre.value) next.set("genre", filters.genre.value);
      if(filters.era.value) next.set("era", filters.era.value);

      var query = next.toString();
      var url = window.location.pathname + (query ? "?" + query : "") + window.location.hash;
      window.history.replaceState({}, "", url);
    }

    function updateBackLink(){
      if(filters.artist.value){
        backToArtistsLink.href = "../artist.html?artist_id=" + encodeURIComponent(filters.artist.value);
      } else {
        backToArtistsLink.href = "../index.html";
      }
    }

    function currentFilters(){
      return {
        artistId: String(filters.artist.value || "").trim(),
        priority: String(filters.priority.value || "").trim(),
        owned: String(filters.owned.value || "").trim(),
        genre: String(filters.genre.value || "").trim(),
        era: String(filters.era.value || "").trim()
      };
    }

    function filteredAlbums(){
      var state = currentFilters();

      return albums.filter(function(album){
        if(state.artistId && String(album.artist_id).trim() !== state.artistId) return false;
        if(state.priority && String(album.buy_priority || "").trim() !== state.priority) return false;
        if(state.genre && String(album.album_genre || "").trim() !== state.genre) return false;
        if(state.era && String(album.era || "").trim() !== state.era) return false;

        if(state.owned === "owned" && !isOwned(album.owned)) return false;
        if(state.owned === "wanted" && isOwned(album.owned)) return false;

        return true;
      }).sort(compareAlbums);
    }

    function renderAlbums(){
      var visibleAlbums = filteredAlbums();
      closeActivePreview();
      updateUrl();
      updateBackLink();

      resultCount.textContent = visibleAlbums.length + (visibleAlbums.length === 1 ? " Album" : " Albums");
      albumGrid.innerHTML = "";

      if(!visibleAlbums.length){
        albumGrid.innerHTML =
          "<div class='empty-state'>No albums match the current filters. Reset the filters to return to the full browser.</div>";
        return;
      }

      visibleAlbums.forEach(function(album){
        var item = items.find(function(entry){
          return entry && entry.album && String(entry.album.album_id).trim() === String(album.album_id).trim();
        });
        var card = document.createElement("a");
        card.className = "card";
        card.href = "album.html?id=" + encodeURIComponent(album.album_id);

        var coverPath = coverSrc(album.cover_path);
        if(coverPath){
          var img = document.createElement("img");
          img.src = coverPath;
          img.alt = safe(album.album_title);
          img.onerror = function(){
            img.replaceWith(createCoverFallback());
          };
          card.appendChild(img);
        } else {
          card.appendChild(createCoverFallback());
        }

        var year = document.createElement("div");
        year.className = "year-line";
        year.textContent = safe(album.year);

        var title = document.createElement("div");
        title.className = "album-title";
        title.textContent = safe(album.album_title);

        var artist = document.createElement("div");
        artist.className = "artist-name";
        artist.textContent = safe(album.artist_name);

        var collectionLine = document.createElement("div");
        collectionLine.className = "collection-line";

        var priority = document.createElement("span");
        priority.className = "priority-mark";
        priority.textContent = safe(album.buy_priority);

        var owned = document.createElement("span");
        owned.className = "collection-mark";
        owned.textContent = isOwned(album.owned) ? "✓ Owned" : "";

        var hover = document.createElement("div");
        hover.className = "hover-detail";
        var previewLines = trackPreviewLines(item);

        if(previewLines.length){
          previewLines.forEach(function(track){
            var line = document.createElement("div");
            line.className = "hover-track-line";

            var position = document.createElement("span");
            position.className = "hover-track-position";
            position.textContent = track.position;

            var hoverTitle = document.createElement("span");
            hoverTitle.className = "hover-track-title";
            hoverTitle.textContent = track.title;

            line.appendChild(position);
            line.appendChild(hoverTitle);

            if(present(track.duration)){
              var duration = document.createElement("span");
              duration.className = "hover-track-duration";
              duration.textContent = track.duration;
              line.appendChild(duration);
            }

            hover.appendChild(line);
          });
        } else {
          var fallback = document.createElement("div");
          fallback.className = "hover-track-line";

          var fallbackTitle = document.createElement("span");
          fallbackTitle.className = "hover-track-title";
          fallbackTitle.textContent = "Track detail not yet available";
          fallbackTitle.style.gridColumn = "1 / -1";

          fallback.appendChild(fallbackTitle);
          hover.appendChild(fallback);
        }

        var hoverActions = document.createElement("div");
        hoverActions.className = "hover-actions";

        var albumLink = document.createElement("a");
        albumLink.className = "hover-album-link";
        albumLink.href = card.href;
        albumLink.textContent = "Open album page";
        albumLink.addEventListener("click", function(event){
          event.preventDefault();
          event.stopPropagation();
          window.location.href = card.href;
        });
        hoverActions.appendChild(albumLink);
        hover.appendChild(hoverActions);

        collectionLine.appendChild(priority);
        collectionLine.appendChild(owned);

        card.appendChild(year);
        card.appendChild(title);
        card.appendChild(artist);
        card.appendChild(collectionLine);
        card.appendChild(hover);

        card.addEventListener("click", function(event){
          if(isTouchPreviewMode()){
            event.preventDefault();
            event.stopPropagation();
            if(activePreviewCard === card){
              return;
            }
            openPreview(card);
          }
        });

        albumGrid.appendChild(card);
      });
    }

    function createCoverFallback(){
      var fallback = document.createElement("div");
      fallback.className = "card-cover-placeholder";
      fallback.textContent = "No album cover";
      return fallback;
    }

    [filters.artist, filters.priority, filters.owned, filters.genre, filters.era].forEach(function(select){
      select.addEventListener("change", renderAlbums);
    });

    filters.reset.addEventListener("click", function(){
      filters.artist.value = "";
      filters.priority.value = "";
      filters.owned.value = "";
      filters.genre.value = "";
      filters.era.value = "";
      renderAlbums();
    });

    document.addEventListener("pointerdown", function(event){
      if(!isTouchPreviewMode() || !activePreviewCard) return;
      if(activePreviewCard.contains(event.target)) return;
      closeActivePreview();
    });

    window.addEventListener("resize", function(){
      if(!isTouchPreviewMode()){
        closeActivePreview();
      }
    });

    window.addEventListener("scroll", function(){
      if(isTouchPreviewMode()){
        closeActivePreview();
      }
    }, { passive: true });

    renderAlbums();
  })
  .catch(function(err){
    console.error(err);
    document.getElementById("albumGrid").innerHTML =
      "<div class='empty-state'>Failed to load album data.</div>";
  });
</script>

</body>
</html>
