<!DOCTYPE html>

<script>
(function(){
  function detectTouchDevice(){
    var coarsePointer =
      window.matchMedia && window.matchMedia("(hover: none) and (pointer: coarse)").matches;
    var touchPoints = navigator.maxTouchPoints > 0;
    var ipadLikeMac = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
    return coarsePointer || touchPoints || ipadLikeMac;
  }

  if(detectTouchDevice()){
    document.addEventListener("DOMContentLoaded", function(){
      document.body.classList.add("touch-mode");
    });
  }
})();

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;
  color:#ddd5ca;
}

body.dark-default{ background-image:url("../backgrounds/rac.jpg"); }
body.dark-muted{ background-image:url("../backgrounds/rac.jpg"); }
body.dark-ultra{ background-image:url("../backgrounds/rac.jpg"); }

body{
  background-size:cover;

  background-attachment:fixed;
}

body::before{

  inset:0;
  background:rgba(0,0,0,.58);

}

body::after{

.app-header{

.nav-pill.active{

.breadcrumb{

    <a href="albums.html" class="nav-pill active" data-nav="albums">Albums</a>

  </nav>

<script>
function fetchAlbumExport(){
  return fetch("../data/albums/albums_export.json?v=" + Date.now()).then(function(r){
    if(!r.ok) throw new Error("Failed to load ../data/albums/albums_export.json");
    return r.json();
  });
}

fetchAlbumExport()
  .then(function(data){
    var params = new URLSearchParams(window.location.search);
    var albumId = String(params.get("id") || "").trim();
    if(!albumId){
      try{
        var pendingReturnUrl = localStorage.getItem("vinyl_spotify_return_url");
        if(pendingReturnUrl){
          albumId = String(new URL(pendingReturnUrl).searchParams.get("id") || "").trim();
        }
      } catch(_){}
    }
    var item = (data || []).find(function(entry){
      return entry && entry.album && String(entry.album.album_id).trim() === albumId;
    });

    var root = document.getElementById("albumView");

    function present(value){
      return value !== null && value !== undefined && String(value).trim() !== "";
    }

    function safe(value){
      return present(value) ? String(value) : "—";
    }

    function escapeHtml(value){
      return String(value == null ? "" : value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function isOwned(value){
      return (
        value === 1 ||
        value === "1" ||
        value === true ||
        String(value).toLowerCase() === "true"
      );
    }

    function coverSrc(path){
      if(!present(path)) return "";
      return "../media/covers/" + String(path).split("/").pop();
    }

    function spotifyAlbumUrl(spotifyAlbumId){
      if(!present(spotifyAlbumId)) return "";
      return "https://open.spotify.com/album/" + encodeURIComponent(String(spotifyAlbumId).trim());
    }

    function applySpotifyLabel(link, label){
      if(!link) return link;
      link.classList.add("spotify-link");
      link.textContent = label || "Play on Spotify";
      return link;
    }

    var SPOTIFY_CLIENT_ID = "93a6954f4a4b4a5bb7d37078ad8f90b8";
    var SPOTIFY_SCOPES = [
      "streaming",
      "user-read-email",
      "user-read-private",
      "user-read-playback-state",
      "user-modify-playback-state"
    ];
    var spotifyPrimarySlot = null;
    var spotifyNotice = null;
    var playbackControls = null;
    var spotifyPreviousButton = null;
    var spotifyToggleButton = null;
    var spotifyNextButton = null;
    var spotifySdkPromise = null;
    var spotifyPlayer = null;
    var spotifyDeviceId = "";
    var spotifyProfile = null;
    var spotifyPlaybackStarted = false;
    var spotifyContextUri = present(item && item.album && item.album.spotify_album_id)
      ? "spotify:album:" + String(item.album.spotify_album_id).trim()
      : "";

    function setPlaybackNotice(message, tone){
      if(!spotifyNotice) return;
      if(!present(message)){
        spotifyNotice.hidden = true;
        spotifyNotice.textContent = "";
        spotifyNotice.removeAttribute("data-tone");
        return;
      }
      spotifyNotice.hidden = false;
      spotifyNotice.textContent = String(message);
      if(present(tone)){
        spotifyNotice.setAttribute("data-tone", String(tone));
      } else {
        spotifyNotice.removeAttribute("data-tone");
      }
    }

    function setPlaybackControlsVisible(visible){
      if(!playbackControls) return;
      playbackControls.hidden = !visible;
    }

    function setToggleButtonLabel(isPaused){
      if(!spotifyToggleButton) return;
      spotifyToggleButton.textContent = isPaused ? "Play" : "Pause";
    }

    function runSpotifyTransportAction(button, action, fallbackMessage){
      if(!spotifyPlayer){
        setPlaybackNotice("Spotify player is not ready yet.", "warn");
        return;
      }
      button.disabled = true;
      Promise.resolve()
        .then(action)
        .catch(function(error){
          setPlaybackNotice((error && error.message) || fallbackMessage, "warn");
        })
        .finally(function(){
          button.disabled = false;
        });
    }

    function spotifyRedirectUri(){
      return window.location.origin + window.location.pathname;
    }

    function spotifyReturnUrl(){
      return window.location.href;
    }

    function spotifyStorageGet(key){
      try{
        return localStorage.getItem(key);
      } catch(_){
        return null;
      }
    }

    function spotifyStorageSet(key, value){
      try{
        localStorage.setItem(key, value);
      } catch(_){}
    }

    function spotifyStorageRemove(key){
      try{
        localStorage.removeItem(key);
      } catch(_){}
    }

    function randomString(length){
      var chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      var values = crypto.getRandomValues(new Uint8Array(length));
      return Array.from(values, function(value){
        return chars[value % chars.length];
      }).join("");
    }

    function base64UrlEncode(input){
      return btoa(String.fromCharCode.apply(null, Array.from(new Uint8Array(input))))
        .replace(/=/g, "")
        .replace(/\+/g, "-")
        .replace(/\//g, "_");
    }

    function sha256(plain){
      var encoder = new TextEncoder();
      return crypto.subtle.digest("SHA-256", encoder.encode(plain));
    }

    function hasCoreSpotifySupport(){
      return !!(
        window.fetch &&
        window.Promise &&
        window.crypto &&
        window.crypto.subtle &&
        window.localStorage &&
        present(SPOTIFY_CLIENT_ID)
      );
    }

    function isLocalhostRuntime(){
      var host = String(window.location.hostname || "").toLowerCase();
      return host === "localhost" || host === "127.0.0.1" || host === "::1";
    }

    function isSecurePlaybackRuntime(){
      return window.location.protocol === "https:" || isLocalhostRuntime() || !!window.isSecureContext;
    }

    function hasStoredSpotifySession(){
      return present(spotifyStorageGet("vinyl_spotify_access_token")) || present(spotifyStorageGet("vinyl_spotify_refresh_token"));
    }

    function spotifyRuntimeMessage(){
      if(!isSecurePlaybackRuntime()){
        return "This local container runtime does not meet Spotify's secure playback requirements. In-app playback should work on the published HTTPS site.";
      }
      return "This environment does not expose the browser features required for Spotify in-app playback.";
    }

    function classifySpotifyInitFailure(message){
      var text = String(message || "");
      if(/premium/i.test(text)){
        return { kind: "premium", message: "In-app playback requires Spotify Premium." };
      }
      if((/secure|security|https|origin|not supported|unsupported/i.test(text) && !isSecurePlaybackRuntime())){
        return { kind: "runtime", message: spotifyRuntimeMessage() };
      }
      if(/unsupported|not supported/i.test(text)){
        return { kind: "unsupported", message: "Spotify in-app playback is not supported in this environment." };
      }
      return { kind: "init_failed", message: text || "Spotify player could not be initialized." };
    }

    function createSpotifyAction(label, onClick){
      var button = document.createElement("button");
      button.type = "button";
      button.className = "card-link";
      button.textContent = label;
      button.addEventListener("click", function(event){
        event.preventDefault();
        event.stopPropagation();
        onClick(event, button);
      });
      return button;
    }

      if(mode === "connect"){
        spotifyPrimarySlot.appendChild(createSpotifyAction("Connect Spotify", function(){

        }));

    function redirectToSpotifyLogin(){
      if(!hasCoreSpotifySupport()){
        setPlaybackNotice("This environment does not expose the browser features required for Spotify in-app playback.", "warn");
        return;
      }

      Promise.resolve()
        .then(function(){
          var verifier = randomString(64);
          return sha256(verifier).then(function(hash){
            var challenge = base64UrlEncode(hash);
            var state = randomString(16);

            spotifyStorageSet("vinyl_spotify_pkce_verifier", verifier);
            spotifyStorageSet("vinyl_spotify_auth_state", state);
            spotifyStorageSet("vinyl_spotify_return_url", spotifyReturnUrl());

            var params = new URLSearchParams({
              client_id: SPOTIFY_CLIENT_ID,
              response_type: "code",
              redirect_uri: spotifyRedirectUri(),
              code_challenge_method: "S256",
              code_challenge: challenge,
              state: state,
              scope: SPOTIFY_SCOPES.join(" ")
            });

            window.location.href = "https://accounts.spotify.com/authorize?" + params.toString();
          });
        })
        .catch(function(error){
          setPlaybackNotice((error && error.message) || "Spotify login could not be started.", "warn");
        });
    }

    function exchangeCodeForToken(code){
      var verifier = spotifyStorageGet("vinyl_spotify_pkce_verifier");
      if(!present(verifier)){
        return Promise.reject(new Error("Missing Spotify login state. Try connecting again."));
      }

      var body = new URLSearchParams({
        client_id: SPOTIFY_CLIENT_ID,
        grant_type: "authorization_code",
        code: code,
        redirect_uri: spotifyRedirectUri(),
        code_verifier: verifier
      });

      return fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body
      })
        .then(function(response){
          return response.text().then(function(text){
            var data = {};
            try{
              data = text ? JSON.parse(text) : {};
            } catch(_){}
            if(!response.ok){
              throw new Error(data.error_description || data.error || "Spotify token exchange failed.");
            }
            spotifyStorageSet("vinyl_spotify_access_token", data.access_token);
            if(present(data.refresh_token)){
              spotifyStorageSet("vinyl_spotify_refresh_token", data.refresh_token);
            }
            spotifyStorageSet("vinyl_spotify_token_expires_at", String(Date.now() + (Number(data.expires_in || 0) * 1000)));
            spotifyStorageRemove("vinyl_spotify_pkce_verifier");
            spotifyStorageRemove("vinyl_spotify_auth_state");
            return data.access_token;
          });
        });
    }

    function refreshSpotifyToken(){
      var refreshToken = spotifyStorageGet("vinyl_spotify_refresh_token");
      if(!present(refreshToken)) return Promise.resolve(null);

      var body = new URLSearchParams({
        client_id: SPOTIFY_CLIENT_ID,
        grant_type: "refresh_token",
        refresh_token: refreshToken
      });

      return fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: body
      })
        .then(function(response){
          return response.text().then(function(text){
            var data = {};
            try{
              data = text ? JSON.parse(text) : {};
            } catch(_){}
            if(!response.ok){
              throw new Error(data.error_description || data.error || "Spotify token refresh failed.");
            }
            spotifyStorageSet("vinyl_spotify_access_token", data.access_token);
            spotifyStorageSet("vinyl_spotify_token_expires_at", String(Date.now() + (Number(data.expires_in || 0) * 1000)));
            if(present(data.refresh_token)){
              spotifyStorageSet("vinyl_spotify_refresh_token", data.refresh_token);
            }
            return data.access_token;
          });
        })
        .catch(function(){
          return null;
        });
    }

    function getValidSpotifyToken(){
      var stored = spotifyStorageGet("vinyl_spotify_access_token");
      var expiresAt = Number(spotifyStorageGet("vinyl_spotify_token_expires_at") || 0);
      if(present(stored) && Date.now() < (expiresAt - 60000)){
        return Promise.resolve(stored);
      }
      return refreshSpotifyToken().then(function(refreshed){
        return refreshed || null;
      });
    }

    function spotifyApi(path, options){
      return getValidSpotifyToken().then(function(token){
        if(!present(token)){
          throw new Error("Spotify login required.");
        }

        return fetch("https://api.spotify.com/v1" + path, Object.assign({}, options || {}, {
          headers: Object.assign({
            Authorization: "Bearer " + token,
            "Content-Type": "application/json"
          }, options && options.headers ? options.headers : {})
        })).then(function(response){
          if(response.status === 204) return null;
          return response.text().then(function(text){
            var data = null;
            try{
              data = text ? JSON.parse(text) : null;
            } catch(_){}
            if(!response.ok){
              throw new Error(
                (data && data.error && data.error.message) ||
                (data && data.message) ||
                text ||
                ("Spotify API error " + response.status)
              );
            }
            return data;
          });
        });
      });
    }

    function handleSpotifyAuthReturn(){
      var url = new URL(window.location.href);
      var code = url.searchParams.get("code");
      var state = url.searchParams.get("state");
      if(!present(code)) return Promise.resolve(false);

      var storedState = spotifyStorageGet("vinyl_spotify_auth_state");
      if(!present(state) || state !== storedState){
        setPlaybackNotice("Spotify login could not be verified. Please try again.", "warn");
        return Promise.resolve(false);
      }

      return exchangeCodeForToken(code)
        .then(function(){
          var returnUrl = spotifyStorageGet("vinyl_spotify_return_url");
          if(present(returnUrl)){
            window.history.replaceState({}, document.title, returnUrl);
          } else {
            url.searchParams.delete("code");
            url.searchParams.delete("state");
            window.history.replaceState({}, document.title, url.toString());
          }
          spotifyStorageRemove("vinyl_spotify_return_url");
          setPlaybackNotice("Spotify connected. In-app playback is ready when you are.", "ok");
          return true;
        })
        .catch(function(error){
          setPlaybackNotice(error.message || "Spotify login failed.", "warn");
          return false;
        });
    }

    function fetchSpotifyProfile(){
      return spotifyApi("/me").then(function(profile){
        spotifyProfile = profile || null;
        return spotifyProfile;
      });
    }

    function ensureSpotifySdk(){
      if(window.Spotify) return Promise.resolve(window.Spotify);
      if(spotifySdkPromise) return spotifySdkPromise;

      spotifySdkPromise = new Promise(function(resolve, reject){
        var existingScript = document.querySelector('script[data-spotify-sdk="true"]');
        var timeoutId = window.setTimeout(function(){
          reject(new Error(isSecurePlaybackRuntime()
            ? "Spotify Web Playback SDK timed out while loading."
            : spotifyRuntimeMessage()));
        }, 12000);

        window.onSpotifyWebPlaybackSDKReady = function(){
          window.clearTimeout(timeoutId);
          resolve(window.Spotify);
        };

        if(existingScript) return;

        var script = document.createElement("script");
        script.src = "https://sdk.scdn.co/spotify-player.js";
        script.async = true;
        script.dataset.spotifySdk = "true";
        script.onerror = function(){
          window.clearTimeout(timeoutId);
          reject(new Error(isSecurePlaybackRuntime()
            ? "Spotify Web Playback SDK failed to load."
            : spotifyRuntimeMessage()));
        };
        document.head.appendChild(script);
      });

      return spotifySdkPromise;
    }

    function ensureSpotifyPlayer(){
      if(spotifyPlayer && present(spotifyDeviceId)){
        return Promise.resolve(spotifyDeviceId);
      }

      return ensureSpotifySdk()
        .then(function(){
          return new Promise(function(resolve, reject){
            var settled = false;
            var nextPlayer = new Spotify.Player({
              name: "Vinyl App Browser Player",
              getOAuthToken: function(callback){
                getValidSpotifyToken()
                  .then(function(token){
                    callback(token || "");
                  })
                  .catch(function(){
                    callback("");
                  });
              },
              volume: 0.65
            });

            function fail(message){
              if(settled) return;
              settled = true;
              try{
                nextPlayer.disconnect();
              } catch(_){}
              var classified = classifySpotifyInitFailure(message);
              reject(new Error(classified.message));
            }

            nextPlayer.addListener("initialization_error", function(event){
              fail(event && event.message ? event.message : "Spotify player initialization failed.");
            });
            nextPlayer.addListener("authentication_error", function(event){
              fail("Spotify authentication failed: " + (event && event.message ? event.message : "Unknown error"));
            });
            nextPlayer.addListener("account_error", function(event){
              fail((event && event.message) || "In-app playback requires Spotify Premium.");
            });
            nextPlayer.addListener("playback_error", function(event){
              setPlaybackNotice((event && event.message) || "Spotify playback failed inside the Spotify player.", "warn");
            });
            nextPlayer.addListener("ready", function(event){
              if(settled) return;
              settled = true;
              spotifyPlayer = nextPlayer;
              spotifyDeviceId = event.device_id;
              resolve(spotifyDeviceId);
            });
            nextPlayer.addListener("not_ready", function(){
              spotifyDeviceId = "";
            });
            nextPlayer.addListener("player_state_changed", function(state){
              if(!state){
                spotifyPlaybackStarted = false;
                setPlaybackControlsVisible(false);
                return;
              }
              spotifyPlaybackStarted = !state.paused;
              setPlaybackControlsVisible(!state.paused);
              setToggleButtonLabel(!!state.paused);
            });

            try{
              nextPlayer.activateElement();
            } catch(_){}

            nextPlayer.connect().then(function(ok){
              if(!ok){
                fail("Spotify player failed to connect.");
              }
            }).catch(function(error){
              fail((error && error.message) || "Spotify player failed to connect.");
            });
          });
        });
    }

    function startSpotifyPlayback(button){
      if(button) button.disabled = true;
      ensureSpotifyPlayer()
        .then(function(deviceId){
          return spotifyApi("/me/player", {
            method: "PUT",
            body: JSON.stringify({
              device_ids: [deviceId],
              play: false
            })
          }).catch(function(error){
            throw new Error((error && error.message) || "Playback transfer to the browser player failed.");
          }).then(function(){
            return spotifyApi("/me/player/play?device_id=" + encodeURIComponent(deviceId), {
              method: "PUT",
              body: JSON.stringify({
                context_uri: spotifyContextUri
              })
            });
          }).catch(function(error){
            throw new Error((error && error.message) || "Spotify play command failed.");
          });
        })
        .then(function(){
          setPlaybackNotice(
            "Playback started in the page. On iPad or iPhone, one extra tap may still be needed because of browser playback rules.",
            "ok"
          );
        })
        .catch(function(error){
          var message = error && error.message ? error.message : "Spotify playback could not start.";
          if(/premium/i.test(message)){
            setPlaybackNotice("In-app playback requires Spotify Premium.", "warn");
          } else {
            setPlaybackNotice(message, "warn");
          }
        })
        .finally(function(){
          if(button) button.disabled = false;
        });
    }

    function bootSpotifyPlayback(){
      if(!present(spotifyContextUri)){
        renderSpotifyPrimaryAction("none");
        return Promise.resolve();
      }

      if(!hasCoreSpotifySupport()){
        renderSpotifyPrimaryAction("none");
        setPlaybackNotice("This environment does not expose the browser features required for Spotify in-app playback.", "warn");
        return Promise.resolve();
      }

      if(!isSecurePlaybackRuntime()){
        renderSpotifyPrimaryAction("none");
        setPlaybackNotice(spotifyRuntimeMessage(), "warn");
        return Promise.resolve();
      }

      return handleSpotifyAuthReturn()
        .then(function(){
          return getValidSpotifyToken();
        })
        .then(function(token){
          if(!present(token)){
            renderSpotifyPrimaryAction("connect");
            setPlaybackNotice(
              hasStoredSpotifySession()
                ? "Your Spotify session has expired. Connect Spotify again to enable in-app playback."
                : "Connect Spotify to enable in-app playback.",
              ""
            );
            return null;
          }

          return fetchSpotifyProfile()
            .then(function(profile){
              if(!profile || String(profile.product || "").toLowerCase() !== "premium"){
                renderSpotifyPrimaryAction("none");
                setPlaybackNotice("In-app playback requires Spotify Premium.", "warn");
                return null;
              }

              renderSpotifyPrimaryAction("play");
              setPlaybackControlsVisible(spotifyPlaybackStarted);
              if(spotifyNotice && !present(spotifyNotice.textContent)){
                setPlaybackNotice("Spotify connected. In-app playback is ready when you are.", "ok");
              }
              return profile;
            })
            .catch(function(error){
              renderSpotifyPrimaryAction("connect");
              setPlaybackNotice((error && error.message) || "Spotify connection could not be verified.", "warn");
              return null;
            });
        });
    }

      line.appendChild(title);

      if(present(track.duration)){
        var duration = document.createElement("span");
        duration.className = "hover-track-duration";
        duration.textContent = String(track.duration);
        line.appendChild(duration);
      }

      entry.appendChild(line);

      var details = [
        ["Bonus Track", (String(track.is_bonus) === "1" || String(track.is_bonus).toLowerCase() === "true") ? "Yes" : ""],
        ["Written By", track.written_by],
        ["Major Contributor", track.major_contributing_artist],
        ["Track Notes", track.track_notes]
      ].filter(function(pair){
        return present(pair[1]);
      });

      if(details.length){
        var detailList = document.createElement("div");
        detailList.className = "track-detail-list";

        details.forEach(function(pair){
          var detail = document.createElement("div");
          detail.className = "track-detail";
          detail.innerHTML = "<strong>" + pair[0] + ":</strong> " + String(pair[1]);
          detailList.appendChild(detail);
        });

        entry.appendChild(detailList);
      }

      trackPanel.appendChild(entry);
    });

    right.appendChild(trackPanel);

    top.appendChild(right);
    root.appendChild(top);

    [
      ["Highlights", album.highlights_text],
      ["Release Notes", album.release_notes],
      ["Pressing Notes", album.pressing_notes],
      ["Major Contributors", album.major_contributors]
    ].forEach(function(section){
      if(!present(section[1])) return;
      var panel = document.createElement("div");
      panel.className = "panel";
      panel.innerHTML =
        "<div class='panel-title'>" + section[0] + "</div>" +
        "<div class='panel-text'>" + section[1] + "</div>";
      root.appendChild(panel);
    });

    // Placeholder for future same-artist navigation.

    var footer = document.createElement("div");
    footer.className = "app-footer";
    footer.innerHTML =
      '<div class="footer-copy">' +
      'Data sources: ' +
      '<a href="https://www.discogs.com" target="_blank" rel="noopener noreferrer">Discogs</a>, ' +
      '<a href="https://musicbrainz.org" target="_blank" rel="noopener noreferrer">MusicBrainz</a>, ' +
      '<a href="https://news.google.com" target="_blank" rel="noopener noreferrer">Google News</a>, ' +
      '<a href="https://www.wikipedia.org" target="_blank" rel="noopener noreferrer">Wikipedia</a>. ' +
      'Metadata, images and reference information remain the property of their respective sources.' +
      '</div>' +
      '<img class="footer-icon" src="../backgrounds/icon-256.png?v=20260412" alt="">';
    root.appendChild(footer);
  })
  .catch(function(err){
    console.error(err);
    document.getElementById("albumView").innerHTML =
      "<div class='panel'><div class='panel-title'>Error</div><div class='panel-text'>Failed to load album data.</div></div>";
  });
</script>

</body>
</html>
