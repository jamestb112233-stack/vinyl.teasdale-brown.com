<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="utf-8">
<title>Album Detail</title>

<script>
(function(){
  function detectTouchDevice(){
    var coarsePointer =
      window.matchMedia && window.matchMedia("(hover: none) and (pointer: coarse)").matches;
    var touchPoints = navigator.maxTouchPoints > 0;
    var ipadLikeMac = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
    return coarsePointer || touchPoints || ipadLikeMac;
  }

  if(detectTouchDevice()){
    document.addEventListener("DOMContentLoaded", function(){
      document.body.classList.add("touch-mode");
    });
  }
})();
</script>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;
  color:#ddd5ca;
}

body.dark-default{ background-image:url("../backgrounds/rac.jpg"); }
body.dark-muted{ background-image:url("../backgrounds/rac.jpg"); }
body.dark-ultra{ background-image:url("../backgrounds/rac.jpg"); }

body{
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.58);
  z-index:-1;
}

body::after{
  content:none;
}

.app-header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:84px;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  padding:0 28px;
  z-index:100;
  box-sizing:border-box;
}

.header-brand{
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:8px;
  padding-top:11px;
}

.back-link{
  color:#cfe3ff;
  text-decoration:none;
  border-bottom:1px solid rgba(207,227,255,.35);
  font-size:14px;
  font-weight:700;
  letter-spacing:.02em;
}

.back-link:hover{
  border-bottom-color:rgba(207,227,255,.8);
}

.app-header img{
  height:68px;
  object-fit:contain;
  opacity:.96;
  filter:drop-shadow(0 4px 10px rgba(0,0,0,.55)) saturate(.98) brightness(.99);
}

.container{
  padding:118px 28px 60px;
  max-width:1420px;
  margin:0 auto;
  box-sizing:border-box;
}

.album-header{
  display:grid;
  grid-template-rows:minmax(34px, auto) auto;
  gap:12px;
  margin:0 0 18px;
}

.page-title{
  font-size:28px;
  font-weight:800;
  margin:0;
  line-height:1.2;
  min-height:34px;
  color:#e2dacd;
}

.album-nav{
  display:flex;
  align-items:center;
}

.album-nav select{
  width:360px;
  max-width:100%;
  padding:10px 14px;
  border-radius:10px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(28,28,28,.88);
  color:#f0f0f0;
  font-size:15px;
  outline:none;
}

.artist-panels{
  display:grid;
  grid-template-columns:260px minmax(260px, 1fr);
  gap:20px;
  margin-bottom:18px;
  align-items:stretch;
}

.panel{
  background:rgba(20,20,20,.52);
  border-radius:14px;
  padding:18px;
  box-shadow:
    0 12px 28px rgba(0,0,0,.42),
    0 3px 6px rgba(0,0,0,.28);
  backdrop-filter:blur(4px);
}

.artist-image-panel{
  padding:12px;
}

.album-cover{
  width:100%;
  height:200px;
  object-fit:cover;
  border-radius:8px;
  display:block;
  background:rgba(255,255,255,.05);
}

.artist-image-placeholder{
  width:100%;
  height:200px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  background:rgba(255,255,255,.05);
  color:#c7c1b8;
  font-size:14px;
  border-radius:8px;
}

.card{
  position:relative;
  width:200px;
  background:rgba(20,20,20,.58);
  border-radius:12px;
  padding:12px;
  box-shadow:
    0 12px 28px rgba(0,0,0,.7),
    0 3px 6px rgba(0,0,0,.6);
  backdrop-filter:blur(4px);
  overflow:hidden;
}

.panel-title{
  font-size:16px;
  font-weight:700;
  margin-bottom:14px;
  color:#e2dacd;
}

.meta-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:8px;
}

.meta-item{
  font-size:13px;
}

.meta-label{
  display:block;
  font-size:11px;
  text-transform:uppercase;
  color:#a9a297;
  margin-bottom:3px;
}

.meta-value{
  display:block;
  font-size:13px;
  white-space:pre-wrap;
  color:#cbc5bb;
}

.meta-value a{
  color:#cfe3ff;
  text-decoration:none;
  border-bottom:1px solid rgba(207,227,255,.35);
}

.meta-value a:hover{
  border-bottom-color:rgba(207,227,255,.8);
}

.spotify-link{
  display:inline-flex;
  align-items:center;
  gap:6px;
}

.spotify-link::before{
  content:"";
  width:10px;
  height:10px;
  border-radius:50%;
  background:#1db954;
  box-shadow:0 0 0 1px rgba(29,185,84,.18);
  flex-shrink:0;
}

.meta-note{
  margin-top:4px;
  font-size:12px;
  line-height:1.45;
  color:#c6c0b6;
  white-space:pre-wrap;
}

.panel-text{
  font-size:14px;
  line-height:1.5;
  white-space:pre-wrap;
  max-height:165px;
  overflow-y:auto;
  padding-right:6px;
  color:#cbc6bd;
}

.panel-text-full{
  max-height:none;
  overflow:visible;
  padding-right:0;
}

.description-panel{
  margin-bottom:20px;
}

.section-title{
  font-size:28px;
  font-weight:800;
  margin:0 0 18px;
  color:#e2dacd;
}

.hover-track-line{
  font-size:12px;
  line-height:1.35;
  color:#dbd3c7;
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:10px;
  align-items:start;
}

.hover-track-line + .hover-track-line{
  margin-top:8px;
}

.hover-track-position{
  color:#c2bcb2;
  white-space:nowrap;
}

.hover-track-title{
  min-width:0;
}

.hover-track-duration{
  color:#c2bcb2;
  white-space:nowrap;
}

.track-entry + .track-entry{
  margin-top:14px;
}

.track-detail-list{
  margin:6px 0 0;
  display:grid;
  gap:4px;
}

.track-detail{
  font-size:12px;
  line-height:1.45;
  color:#c6c0b6;
  white-space:pre-wrap;
}

.track-detail strong{
  color:#dfd7cb;
  font-weight:700;
}

.stack{
  display:grid;
  gap:18px;
}

.right-stack{
  display:grid;
  grid-template-columns:minmax(280px, 320px) minmax(0, 1fr);
  gap:18px;
  align-items:start;
}

.metadata-panel{
  width:100%;
}

.tracklist-panel{
  min-width:0;
  max-height:520px;
  overflow-y:auto;
}

.year-line{
  margin-top:10px;
  font-size:12px;
  color:#c6c0b6;
  letter-spacing:.04em;
}

.album-title{
  margin-top:4px;
  font-size:15px;
  font-weight:600;
  line-height:1.35;
  color:#ddd5ca;
}

.collection-line{
  margin-top:8px;
  font-size:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.priority-mark{
  color:#cfc8bc;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.collection-mark{
  font-weight:700;
  letter-spacing:.02em;
  color:#8fdc8f;
  flex-shrink:0;
  white-space:nowrap;
}

.card-links{
  margin-top:8px;
  display:flex;
  justify-content:flex-end;
  gap:10px;
}

.card-link{
  flex-shrink:0;
  font-size:12px;
  font-weight:700;
  letter-spacing:.03em;
  color:#cfe3ff;
  text-decoration:none;
  border-bottom:1px solid rgba(207,227,255,.35);
}

.card-link:hover,
.card-link:focus-visible{
  border-bottom-color:rgba(207,227,255,.8);
}

.app-footer{
  margin-top:60px;
  padding:18px 24px;
  font-size:12px;
  line-height:1.6;
  color:#c6c0b7;
  text-align:center;
  background:rgba(18,18,18,.6);
  border-top:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(4px);
  border-radius:10px;
}

.app-footer a{
  color:#cfe3ff;
  text-decoration:none;
  border-bottom:1px solid rgba(207,227,255,.35);
}

.app-footer a:hover{
  border-bottom-color:rgba(207,227,255,.8);
}

@media (max-width: 1180px){
  .app-header{
    height:74px;
    padding:0 22px;
  }

  .header-brand{
    gap:6px;
    padding-top:8px;
  }

  .app-header img{
    height:54px;
  }

  .container{
    padding:106px 22px 52px;
  }

  .album-header{
    gap:10px;
    margin-bottom:16px;
  }

  .page-title,
  .section-title{
    font-size:24px;
  }

  .artist-panels{
    gap:16px;
  }

  .panel{
    padding:16px;
  }

  .right-stack{
    gap:16px;
  }
}

@media (max-width: 760px){
  .album-nav{
    width:100%;
  }

  .album-nav select{
    width:100%;
  }

  .artist-panels{
    grid-template-columns:1fr;
  }

  .app-header{
    height:auto;
    padding:14px 18px;
    flex-direction:column;
    align-items:flex-start;
    gap:12px;
  }

  .container{
    padding:138px 22px 40px;
  }
}

body.touch-mode{
  background-attachment:scroll !important;
  background-image:none !important;
  background-color:#000 !important;
}

body.touch-mode.dark-default,
body.touch-mode.dark-muted,
body.touch-mode.dark-ultra{
  background-attachment:scroll !important;
}

body.touch-mode::before{
  content:"" !important;
  display:block !important;
  position:fixed !important;
  inset:0 !important;
  z-index:-2 !important;
  background-image:url("../backgrounds/rac.jpg") !important;
  background-size:cover !important;
  background-position:center !important;
  background-repeat:no-repeat !important;
  pointer-events:none !important;
  background-color:transparent !important;
  -webkit-backdrop-filter:none !important;
  backdrop-filter:none !important;
  filter:none !important;
}

body.touch-mode::after{
  content:"" !important;
  display:block !important;
  position:fixed !important;
  inset:0 !important;
  z-index:-1 !important;
  background:rgba(0,0,0,.45) !important;
  pointer-events:none !important;
  -webkit-backdrop-filter:none !important;
  backdrop-filter:none !important;
  filter:none !important;
}

body.touch-mode .app-header,
body.touch-mode .header-brand,
body.touch-mode .panel,
body.touch-mode .card,
body.touch-mode .app-footer{
  -webkit-backdrop-filter:none !important;
  backdrop-filter:none !important;
  filter:none !important;
}

body.touch-mode .panel,
body.touch-mode .card{
  background:rgba(20,20,20,.13) !important;
  box-shadow:
    0 8px 18px rgba(0,0,0,.14),
    0 2px 4px rgba(0,0,0,.08) !important;
}

body.touch-mode .app-footer{
  background:rgba(20,20,20,.10) !important;
  box-shadow:
    0 8px 18px rgba(0,0,0,.12),
    0 2px 4px rgba(0,0,0,.07) !important;
}
</style>
</head>

<body class="dark-default">

<div class="app-header">
  <div class="header-brand">
    <img src="../backgrounds/banner.png?v=20260409" alt="Requisite Vinyl Album Collection">
    <a class="back-link" href="../index.html">Back to Artist</a>
  </div>
</div>

<div class="container">
  <div id="albumView"></div>
</div>

<script>
function fetchAlbumExport(){
  return fetch("../data/albums/albums_export.json?v=" + Date.now()).then(function(r){
    if(!r.ok) throw new Error("Failed to load ../data/albums/albums_export.json");
    return r.json();
  });
}

fetchAlbumExport()
  .then(function(data){
    var params = new URLSearchParams(window.location.search);
    var albumId = String(params.get("id") || "").trim();
    var item = (data || []).find(function(entry){
      return entry && entry.album && String(entry.album.album_id).trim() === albumId;
    });

    var root = document.getElementById("albumView");

    function present(value){
      return value !== null && value !== undefined && String(value).trim() !== "";
    }

    function safe(value){
      return present(value) ? String(value) : "—";
    }

    function isOwned(value){
      return (
        value === 1 ||
        value === "1" ||
        value === true ||
        String(value).toLowerCase() === "true"
      );
    }

    function coverSrc(path){
      if(!present(path)) return "";
      return "../media/covers/" + String(path).split("/").pop();
    }

    function spotifyAlbumUrl(spotifyAlbumId){
      if(!present(spotifyAlbumId)) return "";
      return "https://open.spotify.com/album/" + encodeURIComponent(String(spotifyAlbumId).trim());
    }

    function applySpotifyLabel(link, label){
      if(!link) return link;
      link.classList.add("spotify-link");
      link.textContent = label || "Play on Spotify";
      return link;
    }

    function trackPosition(track){
      if(present(track.position_raw)) return String(track.position_raw).trim();
      if(present(track.side) && present(track.track_number)){
        return String(track.side).trim() + String(track.track_number).trim();
      }
      if(present(track.track_number)) return String(track.track_number).trim();
      return "";
    }

    if(!item){
      root.innerHTML =
        "<div class='panel'><div class='panel-title'>Error</div><div class='panel-text'>Album not found.</div></div>";
      return;
    }

    var album = item.album || {};
    var tracks = Array.isArray(item.tracks) ? item.tracks : [];
    var backLink = document.querySelector(".back-link");
    if(backLink && present(album.artist_id)){
      backLink.href = "../artist.html?artist_id=" + encodeURIComponent(album.artist_id);
    }

    var sameArtistAlbums = (data || [])
      .filter(function(entry){
        return entry && entry.album && String(entry.album.artist_id).trim() === String(album.artist_id).trim();
      })
      .sort(function(a, b){
        var ay = present(a.album.year) ? Number(a.album.year) : 9999;
        var by = present(b.album.year) ? Number(b.album.year) : 9999;
        if(ay !== by) return ay - by;
        return String(a.album.album_title || "").localeCompare(String(b.album.album_title || ""));
      });

    var header = document.createElement("div");
    header.className = "album-header";

    var pageTitle = document.createElement("div");
    pageTitle.className = "page-title";
    pageTitle.textContent = safe(album.artist_name) + " — " + safe(album.album_title);

    var albumNav = document.createElement("div");
    albumNav.className = "album-nav";

    var albumSelect = document.createElement("select");
    sameArtistAlbums.forEach(function(entry){
      var option = document.createElement("option");
      option.value = String(entry.album.album_id);
      option.textContent = present(entry.album.year)
        ? String(entry.album.year) + " — " + String(entry.album.album_title)
        : String(entry.album.album_title);
      if(String(entry.album.album_id).trim() === String(album.album_id).trim()){
        option.selected = true;
      }
      albumSelect.appendChild(option);
    });
    albumSelect.addEventListener("change", function(){
      window.location.href = "album.html?id=" + encodeURIComponent(albumSelect.value);
    });

    header.appendChild(pageTitle);
    albumNav.appendChild(albumSelect);
    header.appendChild(albumNav);
    root.appendChild(header);

    if(present(album.album_description)){
      var descriptionPanel = document.createElement("div");
      descriptionPanel.className = "panel description-panel";
      descriptionPanel.innerHTML =
        "<div class='panel-title'>Profile</div>" +
        "<div class='panel-text panel-text-full'>" + album.album_description + "</div>";
      root.appendChild(descriptionPanel);
    }

    var top = document.createElement("div");
    top.className = "artist-panels";

    var left = document.createElement("div");
    left.className = "stack";

    var coverCard = document.createElement("div");
    coverCard.className = "card";

    var coverPath = coverSrc(album.cover_path);
    if(present(coverPath)){
      var img = document.createElement("img");
      img.className = "album-cover";
      img.src = coverPath;
      img.alt = safe(album.album_title);
      img.onerror = function(){
        coverCard.innerHTML = "<div class='artist-image-placeholder'>No album cover</div>";
      };
      coverCard.appendChild(img);
    } else {
      coverCard.innerHTML = "<div class='artist-image-placeholder'>No album cover</div>";
    }

    var year = document.createElement("div");
    year.className = "year-line";
    year.textContent = safe(album.year);

    var albumTitle = document.createElement("div");
    albumTitle.className = "album-title";
    albumTitle.textContent = safe(album.album_title);

    var collectionLine = document.createElement("div");
    collectionLine.className = "collection-line";

    var priority = document.createElement("span");
    priority.className = "priority-mark";
    priority.textContent = safe(album.buy_priority);

    var owned = document.createElement("span");
    owned.className = "collection-mark";
    owned.textContent = isOwned(album.owned) ? "✓ Owned" : "";

    var spotifyHref = spotifyAlbumUrl(album.spotify_album_id);
    var cardLinks = null;
    if(spotifyHref){
      cardLinks = document.createElement("div");
      cardLinks.className = "card-links";

      var spotifyLink = document.createElement("a");
      spotifyLink.className = "card-link";
      spotifyLink.href = spotifyHref;
      spotifyLink.target = "_blank";
      spotifyLink.rel = "noopener noreferrer";
      applySpotifyLabel(spotifyLink, "Play on Spotify");
      cardLinks.appendChild(spotifyLink);
    }

    collectionLine.appendChild(priority);
    collectionLine.appendChild(owned);

    coverCard.appendChild(year);
    coverCard.appendChild(albumTitle);
    coverCard.appendChild(collectionLine);
    if(cardLinks){
      coverCard.appendChild(cardLinks);
    }

    left.appendChild(coverCard);

    var right = document.createElement("div");
    right.className = "right-stack";

    var metaPanel = document.createElement("div");
    metaPanel.className = "panel metadata-panel";
    metaPanel.innerHTML = "<div class='panel-title'>Metadata</div>";

    var metaGrid = document.createElement("div");
    metaGrid.className = "meta-grid";

    [
      { label: "First Release", value: album.first_release_date },
      { label: "Genre", value: album.album_genre },
      { label: "Era", value: album.era },
      { label: "Label", value: album.label },
      { label: "Country", value: album.pressing_country },
      { label: "Discogs", value: album.discogs_url, href: album.discogs_url },
      { label: "Source", value: album.source, href: album.source },
      { label: "Album Sales", value: album.album_sales },
      { label: "Cover Source", value: album.cover_source_url, href: album.cover_source_url }
    ].forEach(function(entry){
      if(!present(entry.value)) return;
      var item = document.createElement("div");
      item.className = "meta-item";

      var label = document.createElement("span");
      label.className = "meta-label";
      label.textContent = entry.label;

      var value = document.createElement("span");
      value.className = "meta-value";

      if(present(entry.href)){
        var link = document.createElement("a");
        link.href = String(entry.href);
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Open";
        value.appendChild(link);
      } else {
        value.textContent = String(entry.value);
      }

      item.appendChild(label);
      item.appendChild(value);
      metaGrid.appendChild(item);
    });

    metaPanel.appendChild(metaGrid);

    top.appendChild(left);
    right.appendChild(metaPanel);

    if(isOwned(album.owned)){
      var collectorFields = [
        ["Media Condition", album.media_condition],
        ["Sleeve Condition", album.sleeve_condition],
        ["Source", album.source],
        ["Price Paid", album.price_paid],
        ["Notes", album.notes]
      ];

      var collectorPanel = document.createElement("div");
      collectorPanel.className = "panel metadata-panel";
      collectorPanel.innerHTML = "<div class='panel-title'>Collector Details</div>";

      var collectorGrid = document.createElement("div");
      collectorGrid.className = "meta-grid";

      collectorFields.forEach(function(pair){
        var item = document.createElement("div");
        item.className = "meta-item";

        var label = document.createElement("span");
        label.className = "meta-label";
        label.textContent = pair[0];

        var value = document.createElement("span");
        value.className = "meta-value";
        value.textContent = present(pair[1]) ? String(pair[1]) : "—";

        item.appendChild(label);
        item.appendChild(value);
        collectorGrid.appendChild(item);
      });

      collectorPanel.appendChild(collectorGrid);
      left.appendChild(collectorPanel);
    }

    var trackPanel = document.createElement("div");
    trackPanel.className = "panel tracklist-panel";

    var trackTitle = document.createElement("div");
    trackTitle.className = "panel-title";
    trackTitle.textContent = "Tracklist";
    trackPanel.appendChild(trackTitle);

    tracks.forEach(function(track){
      var entry = document.createElement("div");
      entry.className = "track-entry";

      var line = document.createElement("div");
      line.className = "hover-track-line";

      var position = document.createElement("span");
      position.className = "hover-track-position";
      position.textContent = trackPosition(track);

      var title = document.createElement("span");
      title.className = "hover-track-title";
      title.textContent = safe(track.track_title);

      line.appendChild(position);
      line.appendChild(title);

      if(present(track.duration)){
        var duration = document.createElement("span");
        duration.className = "hover-track-duration";
        duration.textContent = String(track.duration);
        line.appendChild(duration);
      }

      entry.appendChild(line);

      var details = [
        ["Bonus Track", (String(track.is_bonus) === "1" || String(track.is_bonus).toLowerCase() === "true") ? "Yes" : ""],
        ["Written By", track.written_by],
        ["Major Contributor", track.major_contributing_artist],
        ["Track Notes", track.track_notes]
      ].filter(function(pair){
        return present(pair[1]);
      });

      if(details.length){
        var detailList = document.createElement("div");
        detailList.className = "track-detail-list";

        details.forEach(function(pair){
          var detail = document.createElement("div");
          detail.className = "track-detail";
          detail.innerHTML = "<strong>" + pair[0] + ":</strong> " + String(pair[1]);
          detailList.appendChild(detail);
        });

        entry.appendChild(detailList);
      }

      trackPanel.appendChild(entry);
    });

    right.appendChild(trackPanel);

    top.appendChild(right);
    root.appendChild(top);

    [
      ["Highlights", album.highlights_text],
      ["Release Notes", album.release_notes],
      ["Pressing Notes", album.pressing_notes],
      ["Major Contributors", album.major_contributors]
    ].forEach(function(section){
      if(!present(section[1])) return;
      var panel = document.createElement("div");
      panel.className = "panel";
      panel.innerHTML =
        "<div class='panel-title'>" + section[0] + "</div>" +
        "<div class='panel-text'>" + section[1] + "</div>";
      root.appendChild(panel);
    });

    // Placeholder for future same-artist navigation.

    var footer = document.createElement("div");
    footer.className = "app-footer";
    footer.innerHTML =
      'Data sources: ' +
      '<a href="https://www.discogs.com" target="_blank" rel="noopener noreferrer">Discogs</a>, ' +
      '<a href="https://musicbrainz.org" target="_blank" rel="noopener noreferrer">MusicBrainz</a>, ' +
      '<a href="https://www.wikipedia.org" target="_blank" rel="noopener noreferrer">Wikipedia</a>. ' +
      'Metadata, images and reference information remain the property of their respective sources.';
    root.appendChild(footer);
  })
  .catch(function(err){
    console.error(err);
    document.getElementById("albumView").innerHTML =
      "<div class='panel'><div class='panel-title'>Error</div><div class='panel-text'>Failed to load album data.</div></div>";
  });
</script>

</body>
</html>
