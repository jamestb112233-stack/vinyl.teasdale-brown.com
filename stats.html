<!DOCTYPE html>
<html>
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/backgrounds/icon-256.png">
<title>Collection Stats</title>
<script src="/touch-bg-layer.js"></script>
<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;
  color:#ddd5ca;
  background:url("backgrounds/rac.jpg") center/cover fixed no-repeat;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.62);
  z-index:-1;
}

.app-header{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:68px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 24px;
  z-index:120;
  box-sizing:border-box;
}

.main-nav{
  display:flex;
  align-items:center;
  gap:10px;
  margin-right:auto;
}

.nav-pill{
  padding:7px 13px;
  border-radius:10px;
  background:rgba(34,34,34,0.38);
  border:1px solid rgba(255,255,255,0.08);
  color:#c8c0b4;
  text-decoration:none;
  font-size:13px;
  font-weight:600;
  letter-spacing:.03em;
  transition:all .18s ease;
  backdrop-filter:blur(4px);
}

.nav-pill:hover{
  background:rgba(60,60,60,0.55);
  border-color:rgba(255,255,255,0.18);
  color:#e6ded2;
}

.nav-pill.active{
  background:rgba(78,68,56,0.48);
  border-color:rgba(210,190,152,0.28);
  color:#eadfcd;
  box-shadow:0 3px 8px rgba(0,0,0,.28), inset 0 0 6px rgba(255,255,255,.05);
}

.header-brand img{
  height:54px;
  object-fit:contain;
  opacity:.88;
  filter:drop-shadow(0 3px 8px rgba(0,0,0,.38)) saturate(.96) brightness(.98);
}

.intro-strip{
  position:fixed;
  top:84px;
  left:0;
  width:100%;
  z-index:111;
  box-sizing:border-box;
  padding:10px 28px 0;
}

.intro-shell{
  max-width:1420px;
  margin:0 auto;
  padding:10px 16px;
  border-radius:14px;
  background:rgba(26,21,17,.42);
  box-shadow:0 10px 24px rgba(0,0,0,.32), 0 2px 4px rgba(0,0,0,.24);
  backdrop-filter:blur(4px);
}

.page-title{
  margin:0 0 6px;
  font-size:32px;
  line-height:1.08;
  color:#f0e6d8;
}

.page-subtitle{
  color:#cec5b8;
  font-size:15px;
  line-height:1.55;
}

.container{
  padding:176px 28px 60px;
  max-width:1420px;
  margin:0 auto;
  box-sizing:border-box;
}

.stats-panel{
  background:rgba(20,20,20,.56);
  border-radius:18px;
  padding:22px;
  box-shadow:0 16px 34px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.04);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.08);
}

.stats-header{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:16px;
  margin-bottom:16px;
}

.stats-title{
  margin:0;
  font-size:24px;
  color:#f0e6d8;
}

.stats-copy{
  margin:6px 0 0;
  color:#c6c0b7;
  line-height:1.5;
}

.stats-status{
  min-height:18px;
  margin-bottom:14px;
  font-size:13px;
  color:#9a938a;
}

.stats-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
  gap:14px;
}

.stat-card{
  min-height:128px;
  padding:16px;
  border-radius:16px;
  border:1px solid rgba(255,255,255,.08);
  background:linear-gradient(180deg, rgba(23,23,23,.82), rgba(18,18,18,.72));
  box-shadow:0 14px 30px rgba(0,0,0,.26), inset 0 1px 0 rgba(255,255,255,.04);
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.stat-label{
  font-size:12px;
  line-height:1.35;
  text-transform:uppercase;
  letter-spacing:.12em;
  color:#d5c6ab;
}

.stat-value{
  margin:0 0 8px;
  font-size:34px;
  line-height:1;
  font-weight:800;
  color:#f3eadc;
}

.stat-context{
  margin:0;
  color:#bfb8ad;
  font-size:13px;
  line-height:1.45;
}

.page-footer{
  margin-top:22px;
  padding:16px 18px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  border-radius:16px;
  background:rgba(17,17,17,.54);
  border:1px solid rgba(255,255,255,.08);
  color:#b2aba2;
  font-size:12px;
  line-height:1.5;
  box-shadow:0 12px 28px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.03);
  backdrop-filter:blur(8px);
}

.page-footer img{
  width:42px;
  height:42px;
  flex:0 0 auto;
  opacity:.92;
}

.visitor-count{
  margin-left:auto;
  min-width:128px;
  color:var(--muted);
  font-size:12px;
  text-align:center;
}

.visitor-count iframe{
  display:block;
  width:128px;
  height:42px;
  margin:2px auto 0;
  border:0;
  opacity:.82;
}

@media (max-width: 720px){
  .app-header{
    padding:0 16px;
    height:auto;
    min-height:68px;
    align-items:flex-start;
    gap:12px;
    padding-top:10px;
    padding-bottom:10px;
  }

  .main-nav{
    flex-wrap:wrap;
  }

  .intro-strip{
    top:110px;
    padding-inline:16px;
  }

  .container{
    padding:206px 16px 44px;
  }

  .stats-header,
  .page-footer{
    flex-direction:column;
    align-items:flex-start;
  }

  .visitor-count{
    margin-left:0;
    text-align:left;
  }
}
</style>
  <script data-goatcounter="https://jamesteasdalebrown.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<div class="app-header">
  <nav class="main-nav">
    <a href="index.html" class="nav-pill" data-nav="artists">Artists</a>
    <a href="albums/albums.html" class="nav-pill" data-nav="albums">Albums</a>
    <a href="news.html" class="nav-pill" data-nav="news">News</a>
    <a href="stats.html" class="nav-pill active" data-nav="stats">Stats</a>
  </nav>
  <div class="header-brand">
    <img src="backgrounds/banner.png?v=20260409" alt="Requisite Vinyl Album Collection">
  </div>
</div>

<div class="intro-strip">
  <div class="intro-shell">
  </div>
</div>

<main class="container">
  <section class="stats-panel">
    <div class="stats-header">
      <div>
        <h2 class="stats-title">Database Snapshot</h2>
      </div>
    </div>
    <div id="statsStatus" class="stats-status">Loading published stats…</div>
    <div id="statsGrid" class="stats-grid"></div>
  </section>

  <footer class="page-footer">
    <div id="footerMeta">Latest JSON export: waiting for published stats.</div>
    <div class="visitor-count" aria-label="Website visitor count">
      Site visits
      <span id="visitorCount"></span>
    </div>
    <img src="backgrounds/icon-256.png?v=20260412" alt="">
  </footer>
</main>

<script>
const statsGridEl = document.getElementById("statsGrid");
const statsStatusEl = document.getElementById("statsStatus");
const footerMetaEl = document.getElementById("footerMeta");

window.addEventListener("load", function(){
  if (window.goatcounter && typeof window.goatcounter.visit_count === "function") {
    window.goatcounter.visit_count({
      append: "#visitorCount",
      path: "/stats.html",
      no_branding: true
    });
  }
});

const statsDefinitions = [
  {
    key: "reference_albums_total",
    label: "Reference Albums",
    context: function(){ return "Source-side album coverage"; }
  },
  {
    key: "curated_albums_total",
    label: "Curated Albums",
    context: function(){ return "Published collection rows"; }
  },
  {
    key: "artists_total",
    label: "Artists",
    context: function(){ return "Artists in the collection snapshot"; }
  },
  {
    key: "owned_copies_total",
    label: "Owned Copies",
    context: function(){ return "Attached owned-copy records"; }
  },
  {
    key: "owned_copy_duplicate_groups",
    label: "Duplicate Copy Groups",
    context: function(value){
      return value === 1 ? "1 album has more than one owned copy" : value + " albums have more than one owned copy";
    }
  },
  {
    key: "curated_with_spotify",
    label: "Curated With Spotify",
    context: function(value, payload){
      const total = Number(payload.curated_albums_total || 0);
      return total ? Math.round((value / total) * 100) + "% of curated albums" : "No curated rows yet";
    }
  },
  {
    key: "reference_with_spotify",
    label: "Reference With Spotify",
    context: function(value, payload){
      const total = Number(payload.reference_albums_total || 0);
      return total ? Math.round((value / total) * 100) + "% of reference albums" : "No reference rows yet";
    }
  },
  {
    key: "curated_missing_spotify",
    label: "Curated Missing Spotify",
    context: function(){ return "Still awaiting Spotify enrichment"; }
  },
  {
    key: "news_article_count",
    label: "Latest News Articles",
    context: function(value, payload){
      const artists = Number(payload.news_artist_count || 0);
      return artists ? "Across " + artists + " artists in the latest snapshot" : value ? "Latest published news snapshot" : "Not available in the current export";
    }
  },
  {
    key: "collection_purchase_value_total",
    label: "Purchase Value",
    money: true,
    context: function(){ return "What you paid for owned copies"; }
  },
  {
    key: "collection_market_guide_mid_total",
    label: "Perceived Value",
    money: true,
    context: function(){ return "Derived guide mid point"; }
  }
];

function escapeHtml(value){
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function formatCount(value){
  return new Intl.NumberFormat().format(Number(value || 0));
}

function formatMoney(value){
  return "£" + new Intl.NumberFormat(undefined, {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  }).format(Number(value || 0));
}

function formatDateTime(value){
  const date = new Date(value);
  if(Number.isNaN(date.getTime())){
    return String(value || "");
  }
  return date.toLocaleString();
}

function renderStats(payload){
  const cards = statsDefinitions.filter(function(item){
    return payload[item.key] !== undefined && payload[item.key] !== null;
  }).map(function(item){
    const value = Number(payload[item.key] || 0);
    const displayValue = item.money ? formatMoney(value) : formatCount(value);
    const context = typeof item.context === "function" ? item.context(value, payload) : String(item.context || "");
    return (
      '<article class="stat-card">' +
        '<div class="stat-label">' + escapeHtml(item.label) + '</div>' +
        '<div class="stat-value">' + escapeHtml(displayValue) + '</div>' +
        '<p class="stat-context">' + escapeHtml(context) + '</p>' +
      '</article>'
    );
  });
  statsGridEl.innerHTML = cards.join("");
}

fetch("./dashboard_stats.json?v=" + Date.now(), { cache: "no-store" })
  .then(function(response){
    if(!response.ok) throw new Error("Failed to load dashboard_stats.json");
    return response.json();
  })
  .then(function(payload){
    renderStats(payload);
    statsStatusEl.textContent = "Published stats loaded.";
    footerMetaEl.textContent = payload.updated_at
      ? "Latest JSON export: " + formatDateTime(payload.updated_at) + "."
      : "Latest JSON export timestamp unavailable.";
  })
  .catch(function(error){
    statsGridEl.innerHTML = "";
    statsStatusEl.textContent = error.message || "Failed to load published stats.";
    footerMetaEl.textContent = "Latest JSON export: unavailable.";
  });
</script>
</body>
</html>
